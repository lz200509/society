spring:
  datasource:
    url: jdbc:mysql://localhost:3306/society?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # 自动根据实体类更新表结构
    show-sql: true     # 显示SQL语句
    properties:
      hibernate:
        format_sql: true  # 格式化SQL

  thymeleaf:
    cache: false  # 开发时关闭缓存

server:
  port: 8080
  servlet:
    context-path: /